<title>SG SpotInfo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#f0f0ee}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;color:#1a1a1a;display:flex;flex-direction:column}
.topbar{background:#1C2B6B;padding:0 14px;padding-top:max(env(safe-area-inset-top),14px);height:calc(52px + max(env(safe-area-inset-top),14px));display:flex;align-items:flex-end;padding-bottom:8px;justify-content:space-between;flex-shrink:0;z-index:2000;position:relative}
.topbar-logo{height:28px;object-fit:contain}
.topbar-title{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:700;pointer-events:none;white-space:nowrap}
.topbar-actions{display:flex;gap:4px;align-items:center}
.icon-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.page{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.page.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid #e4e4e0;border-radius:14px;padding:15px;margin-bottom:11px}
.card-title{font-size:17px;font-weight:800;color:#1C2B6B;margin-bottom:13px}
.lbl{display:block;font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;margin-top:13px}
.lbl:first-child{margin-top:0}
input,textarea{width:100%;padding:10px 12px;font-size:15px;border:1.5px solid #e2e2e2;border-radius:10px;background:#fafafa;color:#1a1a1a;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:#1C2B6B;background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px 15px;border:1.5px solid #ddd;border-radius:10px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;transition:opacity .12s}
.btn:active{opacity:.75}
.btn.primary{background:#CC2B2B;border-color:#CC2B2B;color:#fff}
.btn.navy{background:#1C2B6B;border-color:#1C2B6B;color:#fff}
.btn.danger{border-color:#fca5a5;color:#dc2626;background:#fff5f5}
.btn.sm{padding:7px 11px;font-size:13px;width:auto}
.event-item{background:#fff;border:1px solid #e4e4e0;border-radius:14px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.eid{font-size:23px;font-weight:900;color:#CC2B2B;letter-spacing:-.5px}
.ename{font-size:12px;color:#999;margin-top:1px}
.badge-row{display:flex;gap:5px;margin-top:5px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.badge.gpx{background:#dcfce7;color:#15803d}
.badge.sp{background:#dbeafe;color:#1d4ed8}
.back{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:#1C2B6B;cursor:pointer;margin-bottom:12px}
#map-wrap{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%}
.map-legend{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 11px;z-index:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:180px}
.leg-item{display:flex;align-items:center;gap:6px;padding:2px 0}
.leg-line{width:16px;height:4px;border-radius:2px;flex-shrink:0}
.leg-name{font-size:11px;font-weight:700;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-toolbar{position:absolute;bottom:0;left:0;right:0;z-index:800;background:rgba(255,255,255,.97);border-top:1px solid #e4e4e0;padding:8px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:stretch;flex-wrap:nowrap}
.tbtn{display:flex;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0;padding:0;height:44px;border:1.5px solid #ddd;border-radius:10px;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;cursor:pointer;font-weight:700;white-space:nowrap;overflow:hidden;transition:opacity .12s}
.tbtn:active{opacity:.75}
.tbtn.navy{background:#1C2B6B;border-color:#1C2B6B;color:#fff}
.tbtn.primary{background:#CC2B2B;border-color:#CC2B2B;color:#fff}
.tbtn.green{border-color:#22c55e;color:#15803d}
.tbtn.icon{flex:0 0 36px;font-size:17px;padding:0}
#elev-panel{background:#fff;border-top:1px solid #e4e4e0;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#elev-chart{width:100%!important}
.elev-hair{position:absolute;top:0;bottom:0;width:1.5px;background:#CC2B2B;opacity:0;pointer-events:none}
.elev-tip{position:absolute;top:1px;background:#1C2B6B;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;pointer-events:none;opacity:0;white-space:nowrap;transform:translateX(-50%)}
.elev-mini{display:flex;align-items:center;gap:10px;padding:5px 13px;cursor:pointer;border-bottom:1px solid #f5f5f5}
.elev-mini-bar{flex:1;height:22px;position:relative}
.elev-mini-bar canvas{width:100%!important;height:22px!important}
#spots-panel{background:#fff;border-top:1px solid #e4e4e0;flex-shrink:0;max-height:38vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.spots-panel-header{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 6px;border-bottom:1px solid #f2f2f2;position:sticky;top:0;background:#fff;z-index:1}
.spots-panel-title{font-size:12px;font-weight:800;color:#1C2B6B;text-transform:uppercase;letter-spacing:.05em}
.spot-item{display:flex;align-items:center;padding:8px 13px;border-bottom:1px solid #f5f5f5;gap:10px}
.spot-code-lbl{font-size:16px;font-weight:900;color:#CC2B2B;min-width:56px}
.spot-kms{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.spot-km-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:#f0f4ff;color:#1C2B6B;padding:2px 8px;border-radius:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:18px 18px 0 0;padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}
.modal-title{font-size:16px;font-weight:800;color:#1C2B6B;margin-bottom:14px}
.paste-tabs{display:flex;gap:0;background:#f0f0ee;border-radius:9px;padding:3px;margin-bottom:12px}
.paste-tab{flex:1;padding:7px 4px;font-size:12px;font-weight:700;text-align:center;border-radius:7px;cursor:pointer;color:#999;border:none;background:transparent;font-family:inherit}
.paste-tab.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.empty{text-align:center;padding:2rem 1rem;color:#ccc}
.empty i{font-size:40px;display:block;margin-bottom:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 20px;border-radius:22px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>

          +'<span class="badge sp"><i class="ti ti-map-pin" style="font-size:10px"></i>'+(e.spots||[]).length+' Spots</span>'

// ── MATH ──────────────────────────────────────────────────────────
function hav(a,b){
  var R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180;
  var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.asin(Math.sqrt(h));
}

function nearestKm(lat,lng,track){
  var best=Infinity,idx=0;
  for(var i=0;i<track.points.length;i++){
    var d=hav({lat:lat,lng:lng},track.points[i]);
    if(d<best){best=d;idx=i}
  }
  return{km:track.cumKm[idx],dist:best};
}

function snapToTrack(lat,lng){
  var e=ev();
  if(!e||!e.tracks||!e.tracks.length)return{lat:lat,lng:lng};
  var best=Infinity,bestPt={lat:lat,lng:lng};
  e.tracks.forEach(function(t){
    t.points.forEach(function(p){
      var d=hav({lat:lat,lng:lng},p);
      if(d<best){best=d;bestPt=p}
    });
  });
  return bestPt;
}

function findAmbiguous(lat,lng,track){
  var close=[];
  for(var i=0;i<track.points.length;i++){
    var d=hav({lat:lat,lng:lng},track.points[i]);
    if(d<=0.030)close.push({i:i,km:track.cumKm[i],dist:d});
  }
  if(!close.length)return null;
  close.sort(function(a,b){return a.km-b.km});
  var clusters=[];
  close.forEach(function(pt){
    var last=clusters[clusters.length-1];
    if(last&&pt.km-last[last.length-1].km<=0.5){last.push(pt)}
    else{clusters.push([pt])}
  });
  if(clusters.length<2)return null;
  var best=clusters.map(function(cl){return cl.reduce(function(a,b){return a.dist<b.dist?a:b})});
  if(Math.abs(best[0].km-best[best.length-1].km)<0.5)return null;
  var deduped=[];
  best.forEach(function(b){
    if(!deduped.length||Math.abs(b.km-deduped[deduped.length-1].km)>0.5)deduped.push(b);
  });
  if(deduped.length<2)return null;
  return deduped.map(function(b){return{km:b.km,dist:b.dist}});
}

// ── GPX ───────────────────────────────────────────────────────────
function handleGPX(evt){
  Array.from(evt.target.files).forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){parseGPX(e.target.result,f.name)};
    r.readAsText(f);
  });
  evt.target.value='';
}

function parseGPX(xml,fn){
  try{
    var doc=new DOMParser().parseFromString(xml,'application/xml');
    var pts=Array.from(doc.querySelectorAll('trkpt,rtept'));
    if(!pts.length){toast('No track points in '+fn);return}
    var hasEle=false;
    var points=pts.map(function(p){
      var ele=p.querySelector('ele');
      if(ele)hasEle=true;
      return{lat:parseFloat(p.getAttribute('lat')),lng:parseFloat(p.getAttribute('lon')),ele:ele?parseFloat(ele.textContent):null};
    }).filter(function(p){return!isNaN(p.lat)&&!isNaN(p.lng)});
    var totalKm=0,cumKm=[0];
    for(var i=1;i<points.length;i++){totalKm+=hav(points[i-1],points[i]);cumKm.push(totalKm)}
    var e=ev();if(!e)return;
    if(!e.tracks)e.tracks=[];
    var name=fn.replace(/\.gpx$/i,'');
    e.tracks.push({name:name,points:points,totalKm:totalKm,hasEle:hasEle,cumKm:cumKm});
    // Rematch all existing spots against all tracks including new one
    if(e.spots&&e.spots.length){
      e.spots.forEach(function(s){
        s.results=e.tracks.map(function(t){
          var r=nearestKm(s.coords.lat,s.coords.lng,t);
          return{name:t.name,km:r.km,dist:r.dist};
        });
      });
    }
    saveState();
    resetMap();
    initMap();
    toast('"'+name+'" loaded · '+totalKm.toFixed(1)+' km');
  }catch(err){toast('Error reading: '+fn)}
}

// ── KML ───────────────────────────────────────────────────────────
function handleKML(evt){
  var file=evt.target.files[0];if(!file)return;
  var name=file.name.toLowerCase();
  if(name.endsWith('.kmz')){
    // KMZ = zipped KML — unzip in browser using DecompressionStream
    var reader=new FileReader();
    reader.onload=function(e){
      var blob=new Blob([e.target.result]);
      var ds=new DecompressionStream('deflate-raw');
      // Use JSZip if available, else try native unzip
      unzipKMZ(e.target.result);
    };
    reader.readAsArrayBuffer(file);
  } else {
    var r=new FileReader();
    r.onload=function(e){parseKML(e.target.result)};
    r.readAsText(file);
  }
  evt.target.value='';
}

function unzipKMZ(arrayBuffer){
  // Load JSZip dynamically if not already loaded
  if(typeof JSZip==='undefined'){
    var script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload=function(){doUnzipKMZ(arrayBuffer)};
    script.onerror=function(){toast('Could not load KMZ support')};
    document.head.appendChild(script);
  } else {
    doUnzipKMZ(arrayBuffer);
  }
}

function doUnzipKMZ(arrayBuffer){
  JSZip.loadAsync(arrayBuffer).then(function(zip){
    // Find the first .kml file inside the zip
    var kmlFile=null;
    zip.forEach(function(path,file){
      if(!kmlFile&&path.toLowerCase().endsWith('.kml'))kmlFile=file;
    });
    if(!kmlFile){toast('No KML found inside KMZ');return}
    kmlFile.async('string').then(function(kmlText){
      parseKML(kmlText);
    });
  }).catch(function(err){
    console.error(err);
    toast('Error reading KMZ file');
  });
}

function parseKML(xml){
  try{
    var doc=new DOMParser().parseFromString(xml,'application/xml');
    var placemarks=Array.from(doc.querySelectorAll('Placemark'));
    if(!placemarks.length){toast('No placemarks in KML');return}
    var e=ev();if(!e)return;
    var hasGPX=e.tracks&&e.tracks.length>0;
    var newSpots=[];
    placemarks.forEach(function(pm){
      var coordEl=pm.querySelector('Point coordinates');
      if(!coordEl)return;
      var parts=coordEl.textContent.trim().split(',');
      if(parts.length<2)return;
      var lng=parseFloat(parts[0]),lat=parseFloat(parts[1]);
      if(isNaN(lat)||isNaN(lng))return;
      var nameEl=pm.querySelector('name');
      var name=nameEl?nameEl.textContent.trim():'SPOT';
      name=name.substring(0,12).toUpperCase().replace(/[^A-Z0-9]/g,'')||'SPOT';
      var snapped=snapToTrack(lat,lng);
      var results=(e.tracks||[]).map(function(t){
        var r=nearestKm(snapped.lat,snapped.lng,t);
        return{name:t.name,km:r.km,dist:r.dist};
      });
      newSpots.push({kuerzel:name,coords:{lat:snapped.lat,lng:snapped.lng},results:results,ts:Date.now(),fromKML:true});
    });
    if(!newSpots.length){toast('No valid point placemarks found');return}
    // Show interactive preview before saving
    showKMLPreview(newSpots, function(finalSpots){
      if(!e.spots)e.spots=[];
      if(e.spots.length>0){
        if(confirm('Add '+finalSpots.length+' spots to existing '+e.spots.length+' spots? OK=Add / Cancel=Replace')){
          e.spots.push.apply(e.spots,finalSpots);
        }else{e.spots=finalSpots}
      }else{e.spots.push.apply(e.spots,finalSpots)}
      saveState();
      redrawSpotMarkers();
      updateSpotsCountBadge();
      updatePDFBtn();
      if(spotsPanelOpen)updateSpotsPanelList();
      if(!hasGPX){
        showKMLNoGPXBanner();
      } else {
        showKMLSummary(finalSpots);
      }
    });
  }catch(err){console.error(err);toast('Error reading KML')}
}

function showKMLNoGPXBanner(){
  var modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;display:flex;align-items:flex-end;justify-content:center';
  var inner=document.createElement('div');

function showKMLPreview(candidateSpots, onConfirm){

  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;display:flex;align-items:flex-end;justify-content:center';
  var inner=document.createElement('div');
  inner.style.cssText='background:#fff;border-radius:18px 18px 0 0;padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column';

  function renderRows(){
    return candidateSpots.map(function(s,i){
      var kms=s.results.map(function(r,ri){
        var col=COLORS[ri%COLORS.length];
        return '<span style="display:inline-flex;align-items:center;gap:3px;margin-right:5px">'
          +'<span style="width:6px;height:6px;border-radius:50%;background:'+col+';display:inline-block"></span>'
          +'<b style="color:#1C2B6B;font-size:11px">KM '+r.km.toFixed(1)+'</b></span>';
      }).join('');
      var opacity=selected[i]?'1':'0.35';
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f2f2;opacity:'+opacity+'">'
        +'<span style="font-size:14px;font-weight:900;color:#CC2B2B;min-width:56px">'+s.kuerzel+'</span>'
        +'<div style="flex:1;font-size:11px">'+( kms||'<span style="color:#ccc">No GPX loaded</span>' )+'</div>'
        +'<button data-kml-toggle="'+i+'" style="width:26px;height:26px;border-radius:50%;border:1.5px solid '+(selected[i]?'#CC2B2B':'#ddd')+';background:'+(selected[i]?'#CC2B2B':'#fff')+';color:'+(selected[i]?'#fff':'#bbb')+';cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
          +(selected[i]?'&#x2715;':'&#x2713;')+'</button>'

  function update(){
    var count=selected.filter(Boolean).length;
    inner.querySelector('#kml-preview-subtitle').textContent=count+' of '+candidateSpots.length+' spots selected';
    inner.querySelector('#kml-preview-rows').innerHTML=renderRows();
    inner.querySelector('#kml-confirm-btn').textContent='Import '+count+' Spot'+(count!==1?'s':'');
    inner.querySelector('#kml-confirm-btn').disabled=count===0;
    // Re-attach toggle listeners
    inner.querySelectorAll('[data-kml-toggle]').forEach(function(btn){
      btn.addEventListener('click',function(){

        selected[idx]=!selected[idx];

    });

  inner.innerHTML=''
    +'<div style="font-size:16px;font-weight:800;color:#1C2B6B;margin-bottom:2px">KML Import Preview</div>'
    +'<div id="kml-preview-subtitle" style="font-size:12px;color:#aaa;margin-bottom:10px"></div>'
    +'<div id="kml-preview-rows" style="flex:1;overflow-y:auto;margin:0 -18px;padding:0 18px"></div>'
    +'<div style="display:flex;gap:8px;margin-top:14px;flex-shrink:0">'

// ── JSON IMPORT/EXPORT ────────────────────────────────────────────
function handleJSON(evt){
  var file=evt.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.id){toast('Invalid SpotInfo file');return}
      if(state.events[data.id]&&!confirm('Event '+data.id+' already exists. Overwrite?'))return;
      data.tracks=data.tracks.map(function(t){
        if(!t.cumKm||t.cumKm.length!==t.points.length){
          var km=0,cumKm=[0];
          for(var i=1;i<t.points.length;i++){km+=hav(t.points[i-1],t.points[i]);cumKm.push(km)}
          t.cumKm=cumKm;t.totalKm=km;
        }
        return t;
      });
      state.events[data.id]=data;
      saveState();
      curId=data.id;
      resetMap();
      showPage('map');
      toast('Event '+data.id+' imported');
    }catch(err){toast('Error reading JSON')}
  };
  r.readAsText(file);
  evt.target.value='';
}

function exportEventJSON(){
  var e=ev();if(!e)return;
  var exportData=JSON.parse(JSON.stringify(e));
  exportData.tracks=exportData.tracks.map(function(t){
    return Object.assign({},t,{
      points:t.points.filter(function(_,i){return i%3===0||i===t.points.length-1}),
      cumKm:t.cumKm.filter(function(_,i){return i%3===0||i===t.cumKm.length-1})
    });
  });
  var blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='SpotInfo_'+e.id+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Exported');
}

// ── MAP ───────────────────────────────────────────────────────────
var LAYERS={
  map:{url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'© <a href="https://www.openstreetmap.org/copyright">OSM</a>',maxZoom:19},
  sat:{url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',attr:'Tiles © Esri',maxZoom:19},
  terrain:{url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',attr:'© <a href="https://opentopomap.org">OpenTopoMap</a>',maxZoom:17}
};

function setLayer(name){
  if(!lmap)return;
  currentLayer=name;
  if(baseTileLayer)lmap.removeLayer(baseTileLayer);
  var l=LAYERS[name];
  baseTileLayer=L.tileLayer(l.url,{attribution:l.attr,maxZoom:l.maxZoom}).addTo(lmap);
  baseTileLayer.bringToBack();
  ['map','sat','terrain'].forEach(function(n){
    var btn=document.getElementById('btn-layer-'+n);
    if(!btn)return;
    btn.classList.toggle('active-layer',n===name);
  });
}

function resetMap(){
  if(lmap){lmap.remove();lmap=null}
  spotMarkers=[];
  if(elevChart){elevChart.destroy();elevChart=null}
  miniCharts.forEach(function(c){c.destroy()});
  miniCharts=[];
}

function initMap(){
  var e=ev();
  setTimeout(function(){
    if(lmap){lmap.remove();lmap=null}
    lmap=L.map('map',{zoomControl:true});
    setLayer(currentLayer||'map');
    var legend=document.getElementById('map-legend');
    legend.innerHTML='';
    var allBounds=[];
    if(e&&e.tracks&&e.tracks.length){
      e.tracks.forEach(function(t,i){
        var col=COLORS[i%COLORS.length];
        var lls=t.points.map(function(p){return[p.lat,p.lng]});
        L.polyline(lls,{color:col,weight:5,opacity:.85}).addTo(lmap);
        lls.forEach(function(ll){allBounds.push(ll)});
        L.circleMarker(lls[0],{radius:8,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2.5}).addTo(lmap);
        var fi=L.divIcon({className:'',html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">&#127937;</div>',iconAnchor:[4,20]});
        L.marker(lls[lls.length-1],{icon:fi}).addTo(lmap);
        addDirectionArrows(t,col);
        var item=document.createElement('div');
        item.className='leg-item';
        item.innerHTML='<div class="leg-line" style="background:'+col+'"></div><span class="leg-name">'+t.name+'</span>';
        legend.appendChild(item);
      });
      if(allBounds.length)lmap.fitBounds(allBounds,{padding:[20,20]});
      renderElevation();
    }else{
      lmap.setView([51,10],4);
      document.getElementById('elev-panel').style.display='none';
    }
    redrawSpotMarkers();
    lmap.on('click',function(ev){
      if(!curId)return;
      openSpotModal(ev.latlng.lat,ev.latlng.lng);
    });
    updateSpotsCountBadge();
    updatePDFBtn();
  },80);
}

function addDirectionArrows(track,col){
  if(!lmap||track.points.length<2)return;
  var count=Math.max(3,Math.min(10,Math.floor(track.totalKm/3)));
  var intervalKm=track.totalKm/(count+1);
  var nextKm=intervalKm;
  for(var i=1;i<track.points.length;i++){
    if(track.cumKm[i]<nextKm)continue;
    nextKm+=intervalKm;
    var p1=track.points[i];
    var p2=track.points[Math.min(i+10,track.points.length-1)];
    var deg=Math.atan2(p2.lng-p1.lng,p2.lat-p1.lat)*180/Math.PI;
    var html='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">'
      +'<polygon points="7,1 11,11 7,8 3,11" fill="'+col+'" opacity="0.65"'
      +' stroke="rgba(255,255,255,0.5)" stroke-width="0.8" stroke-linejoin="round"'
      +' transform="rotate('+deg.toFixed(1)+',7,7)"/></svg>';
    L.marker([p1.lat,p1.lng],{icon:L.divIcon({className:'',html:html,iconSize:[14,14],iconAnchor:[7,7]}),interactive:false,zIndexOffset:-200}).addTo(lmap);
    if(nextKm>track.totalKm)break;
  }
}

function buildSpotHTML(kuerzel){
  return '<div style="background:#CC2B2B;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:900;letter-spacing:0.3px;white-space:nowrap;position:relative;margin-bottom:6px;box-shadow:0 2px 6px rgba(0,0,0,0.25)">'
    +kuerzel
    +'<div style="position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #CC2B2B"></div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;align-items:center;margin:0 auto;width:fit-content">'
    +'<div style="width:2px;height:12px;background:#CC2B2B;border-radius:2px"></div>'
    +'<div style="width:8px;height:8px;background:#CC2B2B;border-radius:50%;margin-top:-1px;border:2px solid #fff"></div>'
    +'</div>';
}

function redrawSpotMarkers(){
  spotMarkers.forEach(function(m){m.remove()});
  spotMarkers=[];
  var e=ev();
  if(!e||!e.spots)return;
  e.spots.forEach(function(s,i){addSpotMarker(s,i)});
}

function addSpotMarker(s,i){
  var icon=L.divIcon({
    className:'',
    html:'<div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%)">'+buildSpotHTML(s.kuerzel)+'</div>',
    iconSize:[0,0],iconAnchor:[0,0]
  });
  var m=L.marker([s.coords.lat,s.coords.lng],{icon:icon,draggable:true,zIndexOffset:500}).addTo(lmap);
  m.on('dragend',function(){
    var ll=m.getLatLng();
    var e=ev();if(!e)return;
    var snapped=snapToTrack(ll.lat,ll.lng);
    m.setLatLng([snapped.lat,snapped.lng]);
    e.spots[i].coords={lat:snapped.lat,lng:snapped.lng};
    e.spots[i].results=e.tracks.map(function(t){
      var r=nearestKm(snapped.lat,snapped.lng,t);
      return{name:t.name,km:r.km,dist:r.dist};
    });
    saveState();
    updateSpotsPanelList();
    updateSpotsCountBadge();
    toast('Spot "'+s.kuerzel+'" updated');
  });
  // Click on marker label opens edit modal
  m.on('click',function(ev){
    L.DomEvent.stopPropagation(ev);
    openEditSpot(i);
  });
  spotMarkers.push(m);
}

// ── ELEVATION ─────────────────────────────────────────────────────
function renderElevation(activeIdx){
  var e=ev();if(!e)return;
  var tracksWithEle=e.tracks.map(function(t,i){return{t:t,i:i}}).filter(function(x){return x.t.hasEle});
  if(!tracksWithEle.length){document.getElementById('elev-panel').style.display='none';return}
  document.getElementById('elev-panel').style.display='block';
  if(activeIdx===undefined)activeIdx=tracksWithEle[0].i;
  var track=e.tracks[activeIdx];
  var col=COLORS[activeIdx%COLORS.length];
  var step=Math.max(1,Math.floor(track.points.length/250));
  var spts=track.points.filter(function(_,i){return i%step===0||i===track.points.length-1});
  var skms=track.cumKm.filter(function(_,i){return i%step===0||i===track.cumKm.length-1});
  document.getElementById('elev-active-name').textContent=track.name;
  document.getElementById('elev-active-km').textContent=track.totalKm.toFixed(1)+' km';
  if(elevChart){elevChart.destroy();elevChart=null}
  var ctx=document.getElementById('elev-chart').getContext('2d');
  elevChart=new Chart(ctx,{
    type:'line',
    data:{labels:skms.map(function(k){return k.toFixed(1)}),datasets:[{data:spts.map(function(p){return p.ele}),borderColor:col,borderWidth:2,backgroundColor:col+'25',fill:true,pointRadius:0,tension:.3}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:true,ticks:{font:{size:9},maxTicksLimit:3,color:'#bbb'},grid:{color:'#f5f5f5'}}}}
  });
  setupElevInteraction(spts,skms,col);
  var miniList=document.getElementById('elev-mini-list');
  miniList.innerHTML='';
  miniCharts.forEach(function(c){c.destroy()});
  miniCharts=[];
  tracksWithEle.filter(function(x){return x.i!==activeIdx}).forEach(function(x){
    var mt=x.t,mi=x.i,mcol=COLORS[mi%COLORS.length];
    var mstep=Math.max(1,Math.floor(mt.points.length/80));
    var mpts=mt.points.filter(function(_,j){return j%mstep===0||j===mt.points.length-1});
    var mkms=mt.cumKm.filter(function(_,j){return j%mstep===0||j===mt.cumKm.length-1});
    var id='mc-'+mi;
    var row=document.createElement('div');
    row.className='elev-mini';
    row.innerHTML='<span style="font-size:11px;font-weight:700;color:'+mcol+';min-width:80px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+mt.name+'</span>'
      +'<div class="elev-mini-bar"><canvas id="'+id+'"></canvas></div>'
      +'<span style="font-size:10px;color:#bbb;min-width:44px;text-align:right">'+mt.totalKm.toFixed(1)+' km</span>';
    row.addEventListener('click',function(){renderElevation(mi)});
    miniList.appendChild(row);
    setTimeout(function(){
      var mc=document.getElementById(id);if(!mc)return;
      var ch=new Chart(mc.getContext('2d'),{
        type:'line',
        data:{labels:mkms,datasets:[{data:mpts.map(function(p){return p.ele}),borderColor:mcol,borderWidth:1.5,backgroundColor:mcol+'20',fill:true,pointRadius:0,tension:.3}]},
        options:{animation:false,responsive:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}
      });
      miniCharts.push(ch);
    },30);
  });
}

function setupElevInteraction(spts,skms,col){
  var wrap=document.getElementById('elev-active-wrap');
  var hair=document.getElementById('elev-hair');
  var tip=document.getElementById('elev-tip');
  function move(cx){
    var chartWrap=wrap.querySelector('div[style*="height:72px"]');
    var rect=chartWrap.getBoundingClientRect();
    var pct=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
    var i=Math.round(pct*(spts.length-1));
    var pt=spts[i],km=skms[i];
    if(!pt)return;
    hair.style.left=(cx-rect.left)+'px';hair.style.opacity='1';
    tip.style.left=(cx-rect.left)+'px';tip.style.opacity='1';
    tip.textContent='KM '+km.toFixed(1);
    if(lmap){if(elevMarker)elevMarker.remove();elevMarker=L.circleMarker([pt.lat,pt.lng],{radius:8,color:'#fff',fillColor:col,fillOpacity:1,weight:2.5}).addTo(lmap)}
  }
  function end(){hair.style.opacity='0';tip.style.opacity='0';if(elevMarker){elevMarker.remove();elevMarker=null}}
  wrap.ontouchmove=function(e){e.preventDefault();move(e.touches[0].clientX)};
  wrap.ontouchend=end;
  wrap.onmousemove=function(e){move(e.clientX)};
  wrap.onmouseleave=end;
}

// ── SPOT MODAL ────────────────────────────────────────────────────
var spotModalMode='map';

function openSpotModal(lat,lng){
  pendingPin={lat:lat,lng:lng};
  pendingPasteCoords=null;
  kmOverrides={};
  document.getElementById('spot-code-input').value='';
  document.getElementById('paste-loc').value='';
  document.getElementById('paste-preview').style.display='none';
  document.getElementById('pin-coords-display').textContent='📍 '+lat.toFixed(5)+', '+lng.toFixed(5);
  updateSpotResultsPreview(lat,lng);
  switchPasteTab('map');
  document.getElementById('modal-spot').style.display='flex';
}

function closeSpotModal(){document.getElementById('modal-spot').style.display='none';pendingPin=null;pendingPasteCoords=null;kmOverrides={}}

function switchPasteTab(t){
  spotModalMode=t;
  document.getElementById('ptab-map').classList.toggle('active',t==='map');
  document.getElementById('ptab-paste').classList.toggle('active',t==='paste');
  document.getElementById('ptab-map-content').style.display=t==='map'?'block':'none';
  document.getElementById('ptab-paste-content').style.display=t==='paste'?'block':'none';
  if(t==='map'&&pendingPin)updateSpotResultsPreview(pendingPin.lat,pendingPin.lng);
  if(t==='paste'&&pendingPasteCoords)updateSpotResultsPreview(pendingPasteCoords.lat,pendingPasteCoords.lng);
}

function updateSpotResultsPreview(lat,lng){
  var e=ev();
  var el=document.getElementById('spot-results-preview');
  if(!e||!e.tracks||!e.tracks.length){el.style.display='none';return}
  kmOverrides={};
  var rows=e.tracks.map(function(t,ti){
    var col=COLORS[ti%COLORS.length];
    var ambig=findAmbiguous(lat,lng,t);
    if(ambig){
      var btns=ambig.map(function(a,ai){
        return '<button id="ambig-'+ti+'-'+ai+'" onclick="toggleAmbiguity('+ti+','+a.km.toFixed(2)+',this)"'
          +' style="background:#fff;border:1.5px solid #1C2B6B;color:#1C2B6B;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer;margin:2px">KM '+a.km.toFixed(1)+'</button>';
      }).join('');
      return '<div style="padding:6px 0;border-bottom:1px solid #f2f2f2">'
        +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'
          +'<div style="width:8px;height:8px;border-radius:50%;background:'+col+';flex-shrink:0"></div>'
          +'<span style="flex:1;font-size:12px;color:#555">'+t.name+'</span>'
          +'<span style="font-size:11px;font-weight:700;color:#BA7517;background:#FEF3C7;padding:2px 6px;border-radius:5px">⚠ Ambiguous</span>'
        +'</div>'
        +'<div style="font-size:11px;color:#888;margin-bottom:4px;padding-left:14px">Route passes here twice — select one or both:</div>'
        +'<div style="padding-left:14px">'+btns+'</div>'
      +'</div>';
    }else{
      var r=nearestKm(lat,lng,t);
      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f2f2f2">'
        +'<div style="width:8px;height:8px;border-radius:50%;background:'+col+';flex-shrink:0"></div>'
        +'<span style="flex:1;font-size:12px;color:#555">'+t.name+'</span>'
        +'<span style="font-size:13px;font-weight:800;color:#1C2B6B">KM '+r.km.toFixed(1)+'</span>'
      +'</div>';
    }
  }).join('');
  var svUrl='https://www.google.com/maps?layer=c&cbll='+lat+','+lng;
  el.style.display='block';
  var mpUrl='https://www.mapillary.com/app/?lat='+lat+'&lng='+lng+'&z=17';
  el.innerHTML='<div style="background:#f6f8ff;border-radius:9px;padding:8px 10px">'+rows+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<a href="'+svUrl+'" target="_blank" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;background:#4285F4;color:#fff;border-radius:9px;text-decoration:none;font-size:12px;font-weight:700">&#x1F30D; Street View</a>'
    +'<a href="'+mpUrl+'" target="_blank" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;background:#1DB846;color:#fff;border-radius:9px;text-decoration:none;font-size:12px;font-weight:700">&#x1F4F8; Mapillary</a>'
    +'</div>';
}

function toggleAmbiguity(trackIdx,km,btn){
  if(!kmOverrides[trackIdx])kmOverrides[trackIdx]=[];
  var arr=kmOverrides[trackIdx];
  var idx=arr.indexOf(km);
  if(idx>=0){arr.splice(idx,1);btn.style.background='#fff';btn.style.color='#1C2B6B'}
  else{arr.push(km);btn.style.background='#1C2B6B';btn.style.color='#fff'}
}

function extractCoords(raw){
  raw=raw.trim();var m;
  m=raw.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2],src:'Google Maps'};
  m=raw.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2],src:'Google Maps'};
  m=raw.match(/maps\/place\/[^/]+\/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2],src:'Google Maps'};
  m=raw.match(/!3d(-?\d+\.?\d+)!4d(-?\d+\.?\d+)/);if(m)return{lat:+m[1],lng:+m[2],src:'Google Maps'};
  var wa=raw.replace(/&amp;/g,'&');
  m=wa.match(/[?&](?:lat|q)=(-?\d+\.?\d*)(?:[,&]|%2C)(?:lng=)?(-?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2],src:'WhatsApp'};
  m=raw.match(/(-?\d{1,3}\.?\d+)[,;\s]+(-?\d{1,3}\.?\d+)/);
  if(m){var a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:a,lng:b,src:'Coordinates'}}
  return null;
}

function isShortUrl(raw){return /goo\.gl\/maps|maps\.app\.goo\.gl/i.test(raw.trim())}

async function resolveLocation(){
  var raw=document.getElementById('paste-loc').value.trim();
  var prev=document.getElementById('paste-preview');
  prev.style.display='block';
  var coords=extractCoords(raw);
  if(!coords&&isShortUrl(raw)){
    prev.innerHTML='<span style="color:#1C2B6B">Resolving link...</span>';
    try{
      var res=await fetch('/.netlify/functions/resolve-location?url='+encodeURIComponent(raw));
      var data=await res.json();
      if(data.lat&&data.lng)coords={lat:data.lat,lng:data.lng,src:'Google Maps'};
      else if(data.finalUrl)coords=extractCoords(data.finalUrl);
    }catch(e){prev.innerHTML='<span style="color:#dc2626">Could not resolve link.</span>';return}
  }
  if(!coords){prev.innerHTML='<span style="color:#dc2626">Location not recognised.</span>';return}
  pendingPasteCoords=coords;
  prev.innerHTML='📍 '+coords.lat.toFixed(5)+', '+coords.lng.toFixed(5)+' <span style="font-size:10px;color:#888">('+coords.src+')</span>';
  updateSpotResultsPreview(coords.lat,coords.lng);
}

function saveSpot(){
  var code=document.getElementById('spot-code-input').value.trim().toUpperCase();
  if(!code){toast('Please enter a photographer acronym');return}
  var coords=spotModalMode==='map'?pendingPin:pendingPasteCoords;
  if(!coords){toast(spotModalMode==='paste'?'Resolve the location first':'No pin placed');return}
  var e=ev();if(!e)return;
  if(!e.spots)e.spots=[];
  var snapped=snapToTrack(coords.lat,coords.lng);
  var results=[];
  (e.tracks||[]).forEach(function(t,ti){
    var override=kmOverrides[ti];
    if(override&&Array.isArray(override)&&override.length>0){
      override.sort(function(a,b){return a-b}).forEach(function(km){results.push({name:t.name,km:km,dist:0})});
    }else{
      var r=nearestKm(snapped.lat,snapped.lng,t);
      results.push({name:t.name,km:r.km,dist:r.dist});
    }
  });
  e.spots.push({kuerzel:code,coords:{lat:snapped.lat,lng:snapped.lng},results:results,ts:Date.now()});
  saveState();
  closeSpotModal();
  redrawSpotMarkers();
  updateSpotsCountBadge();
  updatePDFBtn();
  if(spotsPanelOpen)updateSpotsPanelList();
  toast('Spot "'+code+'" saved');
}

function exportPDF(){
  var e=ev();if(!e||!e.spots||!e.spots.length){toast('No spots');return}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  var W=210,M=20,y=M;
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(28,43,107);
  doc.text('SpotInfo',M,y);y+=8;
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(80,80,80);
  doc.text('Event: '+e.id+(e.name?' – '+e.name:''),M,y);y+=5;
  doc.text('Created: '+new Date().toLocaleDateString('en-GB'),M,y);y+=10;
  doc.setDrawColor(220,220,220);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=8;
  e.spots.forEach(function(s,i){
    if(y>265){doc.addPage();y=M}
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(204,43,43);
    doc.text(s.kuerzel,M,y);y+=6;
    s.results.forEach(function(r){
      if(y>275){doc.addPage();y=M}
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(40,40,40);
      doc.text('KM '+r.km.toFixed(1)+'  ·  '+r.name,M+4,y);y+=5;
    });
    y+=4;
    if(i<e.spots.length-1){doc.setDrawColor(240,240,240);doc.line(M,y,W-M,y);y+=6}
  });
  doc.save('SpotInfo_'+e.id+'.pdf');
  toast('Downloading PDF...');
}

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;
  if(!localStorage.getItem('pwa_dismissed')){
    var b=document.getElementById('install-banner');
    if(b)b.style.display='flex';
  }
});

function checkIOSInstall(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var isInApp=navigator.standalone;
  if(isIOS&&!isInApp&&!localStorage.getItem('pwa_dismissed')){
    setTimeout(function(){
      var b=document.getElementById('ios-banner');
      if(b)b.style.display='flex';
    },2500);
  }
}
